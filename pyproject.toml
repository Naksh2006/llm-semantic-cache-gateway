[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-semantic-cache-gateway"
version = "2.0.0"
description = "Semantic Caching & Routing Gateway for LLMs — unified Qdrant store with local embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "fastembed",
    "litellm",
    "qdrant-client",
    "httpx",
    "structlog",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pyrefly]
python_interpreter = ".venv/bin/python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
